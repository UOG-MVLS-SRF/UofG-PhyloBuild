limit_req_zone $binary_remote_addr zone=uploads:10m rate=60r/m;

upstream django {
	server web:8000;
}

server {
	listen 443 ssl;
	server_name phylotree.srf.gla.ac.uk;

	ssl_certificate /etc/nginx/ssl/fullchain.cer;
	ssl_certificate_key /etc/nginx/ssl/phylobuild.key;

	allow 130.209.0.0/16;
	allow 10.224.160.134;
	deny all;

	client_max_body_size 50M;

	limit_req_status 429;

	location /api/ {
		limit_req zone=uploads burst=50 nodelay;

		limit_except GET POST PUT OPTIONS {
			deny all;
		}

		proxy_pass http://web:8000/;

		proxy_connect_timeout 10s;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;

		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		root /usr/share/nginx/html/;
		index index.html index.htm;
		try_files $uri $uri/ /index.html;
	}

	location /django_static/ {
		alias /django_static/;
	}
}