# Production deployment for the Glasgow VM (phylotree.srf.gla.ac.uk / 130.209.52.47).
#
# Runs the pre-built images shipped from the laptop via `docker save`/`docker load`
# (the image: names below). No build: sections, so the VM never compiles anything - it
# just runs the loaded images. (To rebuild after code edits, bring the source over and
# use docker-compose_prod.yml, or add build: sections back.)
# Mirrors the working local stack with production hardening:
#   - restart: unless-stopped on every service (survives reboots)
#   - web keeps the docker.sock mount (REQUIRED - it drives the custom_lib pipeline)
#   - web keeps the media_data volume (job outputs persist across rebuilds)
#   - db/web ports bound to 127.0.0.1 only (not exposed publicly; frontend reaches
#     web over the internal docker network as web:8000)
#   - only the frontend (port 80, + 443 once TLS is added) is public
#
# Bring up with:  ./deploy.sh   (or see the runbook in DEPLOY.md)
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    logging:
      options:
        max-size: 10m
        max-file: "3"
    # localhost-only: not reachable from the internet, but available for admin/psql on the VM
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKERNAME}/${MAINNAME}:${VERSION}
    restart: unless-stopped
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
      - /var/run/docker.sock:/var/run/docker.sock   # REQUIRED: lets web start/stop custom_lib
      - ./genome_library:/genome_library:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ORIGIN_WHITELIST=${CORS_ORIGIN_WHITELIST}
      - DEBUG=${DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_SECRET=${DJANGO_SECRET}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - CUSTOM_LIB_CONTAINER=production-custom_lib-1
      - ACCESSORY_DATA_VOLUME=production_accessory-data
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      env | sed 's/^/export /' > /container.env &&
      service cron start &&
      gunicorn bioinformatics_tool.wsgi:application --bind 0.0.0.0:8000"
    # localhost-only: frontend reaches this as web:8000 over the docker network
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: ${DOCKERNAME}/${FRONTENDNAME}:${VERSION}
    stdin_open: true
    restart: unless-stopped
    volumes:
      - django_static:/django_static
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/ssl/phylobuild:/etc/nginx/ssl:ro # Contains cert information
      - type: bind
        source: ${NGINX_CONF}
        target: /etc/nginx/conf.d/default.conf
        read_only: true # points to the right nginx config from env
    ports:
      - "80:80"
      - "443:443"   
  custom_lib:
    image: ${DOCKERNAME}/${CUSTOMERLIBNAME}:${VERSION}
    restart: unless-stopped
    command: tail -f /dev/null
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - accessory-data:/app/accessory-data

    # no public port - this container is driven internally by web via docker.sock
    deploy:
      resources:
        limits:
          # 500M is enough for tree-only jobs but OOM-kills AMRFinder, which needs roughly
          # 1GB per tblastn thread (it is called with --threads 2). 2G leaves ~2G on a 4GB
          # VM for db+web+frontend+OS. If AMR jobs still die with exit 137, either raise
          # this (needs more VM RAM) or drop AMRFinder to --threads 1 in PhyloBuild.sh.
          memory: 2G

  mob_suite:
    image: quay.io/biocontainers/mob_suite:3.1.9--pyhdfd78af_1
    restart: unless-stopped
    command: tail -f /dev/null
    volumes:
      - media_data:/app/media
      - ./genome_library:/genome_library:ro

volumes:
  django_static:
  media_data:
  accessory-data:
