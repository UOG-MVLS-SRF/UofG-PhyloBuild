services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKERNAME}/${MAINNAME}:${VERSION}
    restart: unless-stopped
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - ./genome_library:/genome_library:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ORIGIN_WHITELIST=${CORS_ORIGIN_WHITELIST}
      - DEBUG=${DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_SECRET=${DJANGO_SECRET}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - CUSTOM_LIB_CONTAINER=devserver-custom_lib-1
      - ACCESSORY_DATA_VOLUME=devserver_accessory-data
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      env | sed 's/^/export /' > /container.env &&
      service cron start &&
      gunicorn bioinformatics_tool.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    image: ${DOCKERNAME}/${FRONTENDNAME}:${VERSION}
    stdin_open: true
    restart: unless-stopped
    volumes:
      - django_static:/django_static
      - /etc/ssl/phylobuild:/etc/nginx/ssl:ro
      - type: bind
        source: ${NGINX_CONF}
        target: /etc/nginx/conf.d/default.conf
        read_only: true # points to the right nginx config from env
    ports:
      - "8443:443"

  custom_lib:
    image: ${DOCKERNAME}/${CUSTOMERLIBNAME}:${VERSION}
    restart: unless-stopped
    command: tail -f /dev/null
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - accessory-data:/app/accessory-data
    deploy:
      resources:
        limits:
          memory: 2G

  mob_suite:
    image: quay.io/biocontainers/mob_suite:3.1.9--pyhdfd78af_1
    restart: unless-stopped
    command: tail -f /dev/null
    volumes:
      - media_data:/app/media
      - ./genome_library:/genome_library:ro

volumes:
  pg_data:
  django_static:
  media_data:
  accessory-data: